name: Byg app

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency: build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Hent signeringsnøgle fra GitHubs hemmelige boks
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Hemmeligheden KEYSTORE_B64 eller KEYSTORE_PASSWORD mangler under Settings → Secrets and variables → Actions" | tee build.log
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Ændringsliste ind i app'en
        shell: bash
        run: |
          # "Næste version" i CHANGELOG.md får det rigtige versionsnummer
          sed -i "s/^- \*\*Næste version\*\*/- **0.1.${{ github.run_number }}**/" CHANGELOG.md
          mkdir -p app/src/main/assets
          cp CHANGELOG.md app/src/main/assets/CHANGELOG.md

      - name: Byg APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Slet nøglen fra byggemaskinen
        if: always()
        shell: bash
        run: rm -f app/release.keystore

      - name: Udgiv på GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CiceroNFC.apk
          # Udgivelsens tekst er versionens linje i CHANGELOG.md – ellers commit-beskeden
          grep -m1 "^- \*\*0\.1\.${{ github.run_number }}\*\* – " CHANGELOG.md | sed 's/^- \*\*[^*]*\*\* – //' > notes.txt || true
          if [ ! -s notes.txt ]; then
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' > notes.txt
          fi
          printf '\nBygget fra %s\n' "${GITHUB_SHA::7}" >> notes.txt
          gh release create "v0.1.${{ github.run_number }}" CiceroNFC.apk \
            --title "Cicero NFC 0.1.${{ github.run_number }}" \
            --notes-file notes.txt --latest

      - name: Skriv versionsnummeret ind i CHANGELOG.md
        shell: bash
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -qm "CHANGELOG: version 0.1.${{ github.run_number }}"
            git push -q origin HEAD:main || echo "Kunne ikke skrive versionsnummeret tilbage (main er ændret imens)"
          fi

      - name: Gem byggelog (til fejlfinding)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logbranch
          cp build.log /tmp/logbranch/build.log 2>/dev/null || echo "ingen log" > /tmp/logbranch/build.log
          echo "${{ job.status }} ${GITHUB_SHA} run ${{ github.run_number }}" > /tmp/logbranch/status.txt
          cd /tmp/logbranch
          git init -q -b build-log
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add .
          git commit -qm "Byggelog ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
