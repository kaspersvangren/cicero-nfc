name: Byg app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Hent signeringsnøgle fra GitHubs hemmelige boks
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Hemmeligheden KEYSTORE_B64 mangler under Settings → Secrets and variables → Actions" | tee build.log
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Byg APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Udgiv på GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CiceroNFC.apk
          gh release create "v0.1.${{ github.run_number }}" CiceroNFC.apk \
            --title "Cicero NFC 0.1.${{ github.run_number }}" \
            --notes "Bygget fra ${GITHUB_SHA::7}" --latest

      - name: Gem byggelog (til fejlfinding)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logbranch
          cp build.log /tmp/logbranch/build.log 2>/dev/null || echo "ingen log" > /tmp/logbranch/build.log
          echo "${{ job.status }} ${GITHUB_SHA} run ${{ github.run_number }}" > /tmp/logbranch/status.txt
          cd /tmp/logbranch
          git init -q -b build-log
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add .
          git commit -qm "Byggelog ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
